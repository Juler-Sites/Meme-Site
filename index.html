<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Meme's Chill Space</title>
    <meta name="apple-mobile-web-app-title" content="Meme's Chill Space" />
    <meta property="og:title" content="Meme's Chill Space" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://static-cdn.jtvnw.net/jtv_user_pictures/e8edde98-0f7e-4409-bbc2-cb0486f4799a-profile_image-70x70.png" />
    <meta name="theme-color" content="#4469af" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
    <link rel="stylesheet" href="/Style.css" />
    <link rel="stylesheet" href="/nav.css" />
    <link rel="icon" type="image/x-icon" href="https://static-cdn.jtvnw.net/jtv_user_pictures/e8edde98-0f7e-4409-bbc2-cb0486f4799a-profile_image-70x70.png" />
</head>
<body>
    <nav class="mg-nav-wrap" aria-label="Main">
      <ul class="mg-nav">
        <li><a href="/" class="mg-nav-active">Home</a></li>
        <li><a href="/help/">Remote Help</a></li>
        <li><a href="https://discord.gg/za5Jxb73zG">Discord</a></li>
        <li><a href="https://www.twitch.tv/inkymunchie">Twitch</a></li>
        <li><a href="https://www.youtube.com/@inkymunchie">YouTube</a></li>
        <li><a href="https://www.tiktok.com/@inkymunchiettv">TikTok</a></li>
      </ul>
    </nav>

    <div class="mg-page">
    <!-- Cutout of her character only, in the page gutters. Hidden when the
         gutters are too narrow to hold the figure without overlapping the
         1199px center column. The right side is a horizontal mirror. -->
    <img class="mg-gutter-fig mg-gutter-fig-left" src="/inkymunchie-figure.webp" width="975" height="2296" alt="" decoding="async" aria-hidden="true">
    <img class="mg-gutter-fig mg-gutter-fig-right" src="/inkymunchie-figure.webp" width="975" height="2296" alt="" decoding="async" aria-hidden="true">

    <!-- Banner art already says Welcome — keep it as an image, not a body background -->
    <img class="mg-banner" src="/bg.png" width="1199" height="480" alt="Welcome to my channel — Meme's Chill Space" />

    <main class="mg-main">
        <p class="mg-tagline">I play many games! If you have any games you'd like me to play just tell me!</p>

        <!-- Twitch card matches the Welcome banner width. The large character
             art (channel offline image) is the hero and stays visible unless
             she is live, when the 16:9 player mounts over it. The iframe is
             still deferred (Chrome 128) and is not in the initial HTML. -->
        <section class="mg-twitch" aria-label="InkyMunchie on Twitch">
            <div class="mg-twitch-card">
            <header class="mg-twitch-head">
                <picture>
                    <source type="image/webp" srcset="/inkymunchie-avatar.webp">
                    <img class="mg-twitch-avatar" src="/inkymunchie-avatar.png" width="72" height="72" alt="InkyMunchie">
                </picture>
                <div class="mg-twitch-id">
                    <p class="mg-twitch-name">InkyMunchie</p>
                    <a class="mg-twitch-handle" href="https://www.twitch.tv/inkymunchie">twitch.tv/inkymunchie</a>
                </div>
            </header>

            <div id="twitch-stream" class="mg-twitch-player">
                <picture class="mg-twitch-hero">
                    <source type="image/webp" srcset="/inkymunchie-offline.webp">
                    <img class="mg-twitch-hero-img" src="/inkymunchie-offline.jpg" width="1920" height="1080" alt="InkyMunchie">
                </picture>
                <p id="twitch-status" class="mg-twitch-status" hidden>Offline</p>
            </div>
            </div>
            <p class="w3-small mg-twitch-alt">
                Or open Twitch in the app:
                <a href="https://www.twitch.tv/inkymunchie">twitch.tv/inkymunchie</a>
            </p>
        </section>
    </main>
    </div>

    <script type="text/javascript">
        (function () {
            var box, statusEl;

            function setOffline() {
                if (!box) return;
                box.classList.remove("is-live");
                box.classList.add("is-offline");
                if (statusEl) statusEl.hidden = false;
            }

            function mountLive() {
                if (!box || box.getAttribute("data-mounted")) return;
                box.setAttribute("data-mounted", "1");
                box.classList.remove("is-offline");
                box.classList.add("is-live");
                if (statusEl) statusEl.hidden = true;
                var iframe = document.createElement("iframe");
                iframe.className = "mg-twitch-iframe";
                iframe.src = "https://player.twitch.tv/?channel=inkymunchie&parent=memegames.net&parent=www.memegames.net&muted=true&autoplay=true";
                iframe.setAttribute("allowfullscreen", "");
                iframe.setAttribute("allow", "autoplay; fullscreen");
                iframe.setAttribute("scrolling", "no");
                iframe.setAttribute("frameborder", "0");
                iframe.setAttribute("title", "InkyMunchie live on Twitch");
                box.appendChild(iframe);
            }

            function isLiveText(t) {
                t = String(t || "").replace(/^\uFEFF/, "").trim();
                if (!t) return false;
                if (/offline/i.test(t)) return false;
                if (/error|not (found|exist)|invalid/i.test(t)) return false;
                return true;
            }

            function checkLive(done) {
                var finished = false;
                function finish(live) {
                    if (finished) return;
                    finished = true;
                    done(live);
                }
                var timer = setTimeout(function () { finish(false); }, 4000);
                if (!window.fetch) {
                    clearTimeout(timer);
                    finish(false);
                    return;
                }
                fetch("https://decapi.me/twitch/uptime/inkymunchie")
                    .then(function (r) { return r.text(); })
                    .then(function (t) {
                        clearTimeout(timer);
                        finish(isLiveText(t));
                    })
                    .catch(function () {
                        clearTimeout(timer);
                        finish(false);
                    });
            }

            function start() {
                box = document.getElementById("twitch-stream");
                statusEl = document.getElementById("twitch-status");
                if (!box) return;
                checkLive(function (live) {
                    if (!live) {
                        setOffline();
                        return;
                    }
                    if ("IntersectionObserver" in window) {
                        var io = new IntersectionObserver(function (entries) {
                            var i;
                            for (i = 0; i < entries.length; i++) {
                                if (entries[i].isIntersecting) {
                                    io.disconnect();
                                    mountLive();
                                    break;
                                }
                            }
                        }, { rootMargin: "120px" });
                        io.observe(box);
                    } else {
                        mountLive();
                    }
                });
            }

            if (document.readyState === "complete") start();
            else window.addEventListener("load", start);
        })();
    </script>
</body>
</html>
