<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Meme's Chill Space</title>
    <meta name="apple-mobile-web-app-title" content="Meme's Chill Space" />
    <meta property="og:title" content="Meme's Chill Space" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://static-cdn.jtvnw.net/jtv_user_pictures/e8edde98-0f7e-4409-bbc2-cb0486f4799a-profile_image-70x70.png" />
    <meta name="theme-color" content="#4469af" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
    <link rel="stylesheet" href="/Style.css" />
    <link rel="stylesheet" href="/nav.css" />
    <link rel="icon" type="image/x-icon" href="https://static-cdn.jtvnw.net/jtv_user_pictures/e8edde98-0f7e-4409-bbc2-cb0486f4799a-profile_image-70x70.png" />
</head>
<body>
    <nav class="mg-nav-wrap" aria-label="Main">
      <ul class="mg-nav">
        <li><a href="/" class="mg-nav-active">Home</a></li>
        <li><a href="/help/">Remote Help</a></li>
        <li><a href="https://discord.gg/za5Jxb73zG">Discord</a></li>
        <li><a href="https://www.twitch.tv/inkymunchie">Twitch</a></li>
        <li><a href="https://www.youtube.com/@inkymunchie">YouTube</a></li>
        <li><a href="https://www.tiktok.com/@inkymunchiettv">TikTok</a></li>
      </ul>
    </nav>

    <!-- Banner art already says Welcome — keep it as an image, not a body background -->
    <img class="mg-banner" src="/bg.png" width="1199" height="480" alt="Welcome to my channel — Meme's Chill Space" />

    <main class="mg-main">
        <p class="mg-tagline">I play many games! If you have any games you'd like me to play just tell me!</p>

        <!-- Twitch loads only after a tap — auto-embed crashes Chrome 128 on some Android phones -->
        <div id="twitch-stream">
            <p>
                <button type="button" id="loadTwitch" class="w3-button w3-purple w3-round">
                    Load live stream
                </button>
            </p>
            <p class="w3-small">
                Or open Twitch in the app:
                <a href="https://www.twitch.tv/inkymunchie">twitch.tv/inkymunchie</a>
            </p>
        </div>
    </main>

    <script type="text/javascript">
        (function () {
            var btn = document.getElementById("loadTwitch");
            if (!btn) return;
            btn.addEventListener("click", function () {
                btn.disabled = true;
                btn.textContent = "Loading…";
                var s = document.createElement("script");
                s.src = "https://embed.twitch.tv/embed/v1.js";
                s.onload = function () {
                    var box = document.getElementById("twitch-stream");
                    box.innerHTML = "";
                    var mount = document.createElement("div");
                    mount.id = "twitch-embed-mount";
                    box.appendChild(mount);
                    var w = Math.min(window.innerWidth - 24, 720);
                    new Twitch.Embed("twitch-embed-mount", {
                        width: w,
                        height: Math.round(w * 9 / 16) + 120,
                        channel: "inkymunchie",
                        allowfullscreen: true,
                        layout: "video",
                        muted: true,
                        parent: ["memegames.net", "www.memegames.net"]
                    });
                };
                s.onerror = function () {
                    btn.disabled = false;
                    btn.textContent = "Load live stream";
                    alert("Could not load Twitch. Try the link instead.");
                };
                document.body.appendChild(s);
            });
        })();
    </script>
</body>
</html>
