<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Meme's Chill Space</title>
    <meta name="apple-mobile-web-app-title" content="Meme's Chill Space" />
    <meta property="og:title" content="Meme's Chill Space" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://static-cdn.jtvnw.net/jtv_user_pictures/e8edde98-0f7e-4409-bbc2-cb0486f4799a-profile_image-70x70.png" />
    <meta name="theme-color" content="#F63798" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
    <link rel="stylesheet" href="/Style.css" />
    <link rel="icon" type="image/x-icon" href="https://static-cdn.jtvnw.net/jtv_user_pictures/e8edde98-0f7e-4409-bbc2-cb0486f4799a-profile_image-70x70.png" />
</head>
<body>
    <div class="w3-bar w3-blue">
        <a href="/" class="w3-bar-item w3-button w3-mobile w3-green">Home</a>
        <a href="/help/" class="w3-bar-item w3-button w3-mobile">Remote Help</a>
        <a href="https://discord.gg/za5Jxb73zG" class="w3-bar-item w3-button w3-mobile">Discord</a>
        <a href="https://www.twitch.tv/inkymunchie" class="w3-bar-item w3-button w3-mobile">Twitch</a>
        <a href="https://www.youtube.com/@inkymunchie" class="w3-bar-item w3-button w3-mobile">YouTube</a>
        <a href="https://www.tiktok.com/@inkymunchiettv" class="w3-bar-item w3-button w3-mobile">TikTok</a>
    </div>

    <div>
        <h1>Welcome &#128420;</h1>
        <style>
            h1 { color: #826c3f; }
        </style>
        <p class="p1">I play many games! If you have any games you'd like me to play just tell me!</p>
    </div>

    <!-- Twitch is loaded only after a tap — auto-embed crashes Chrome 128 on some Android phones -->
    <div id="twitch-stream" class="w3-container w3-padding">
        <p>
            <button type="button" id="loadTwitch" class="w3-button w3-purple w3-round">
                Load live stream
            </button>
        </p>
        <p class="w3-small">
            Or open Twitch in the app:
            <a href="https://www.twitch.tv/inkymunchie">twitch.tv/inkymunchie</a>
        </p>
    </div>
    <script type="text/javascript">
        (function () {
            var btn = document.getElementById("loadTwitch");
            if (!btn) return;
            btn.addEventListener("click", function () {
                btn.disabled = true;
                btn.textContent = "Loading…";
                var s = document.createElement("script");
                s.src = "https://embed.twitch.tv/embed/v1.js";
                s.onload = function () {
                    var box = document.getElementById("twitch-stream");
                    box.innerHTML = "";
                    var mount = document.createElement("div");
                    mount.id = "twitch-embed-mount";
                    box.appendChild(mount);
                    var w = Math.min(window.innerWidth - 24, 720);
                    new Twitch.Embed("twitch-embed-mount", {
                        width: w,
                        height: Math.round(w * 9 / 16) + 120,
                        channel: "inkymunchie",
                        allowfullscreen: true,
                        layout: "video",
                        muted: true,
                        parent: ["memegames.net", "www.memegames.net"]
                    });
                };
                s.onerror = function () {
                    btn.disabled = false;
                    btn.textContent = "Load live stream";
                    alert("Could not load Twitch. Try the link instead.");
                };
                document.body.appendChild(s);
            });
        })();
    </script>
</body>
</html>
